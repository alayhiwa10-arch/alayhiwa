
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALAyHiWA | Official Website</title>
  <meta name="description" content="Welcome to ALAyHiWA — a new world starts here.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #080816;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #00eaff;
      filter: blur(150px);
      opacity: 0.18;
      top: 5%;
      left: 10%;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 55px 25px;
      background: rgba(20, 20, 45, 0.85);
      border: 1px solid rgba(0, 238, 255, 0.45);
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(0, 238, 255, 0.12);
    }

    .logo {
      font-size: clamp(38px, 9vw, 66px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 20px #00d9ff;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 25px;
      margin-bottom: 15px;
    }

    p {
      color: #c8c8dc;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 10px;
      color: #080816;
      background: #00eaff;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      background: white;
      box-shadow: 0 0 25px #00eaff;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 35px;
      color: #77778e;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <main class="card">
    <div class="logo">ALAyHiWA</div>

    <h2>Welcome to My World</h2>

    <p>
      A new beginning. A new vision.<br>
      Welcome to the official ALAyHiWA website.
    </p>

    <a class="button"
       href="mailto:contact@alayhiwa.com">
       Contact Me
    </a>

    <footer>
      © 2026 ALAyHiWA. All rights reserved.
    </footer>
  </main>
</body>
</html>
